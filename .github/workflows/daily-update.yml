name: Daily update

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC; off the hour, when scheduled jobs are delayed most
  workflow_dispatch:
    inputs:
      force:
        description: "Skip safety checks for this run and reset the baseline (use after reviewing a failed run)"
        type: boolean
        default: false

permissions:
  contents: write # commit data/ and update the "latest" release; nothing else

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # Secrets are only exposed to this step. The tool sends keys in headers and never logs
      # them, headers or key-bearing URLs. --check runs the safety checks: on failure nothing is
      # written to data/, the reason goes to the job summary and the job fails (GitHub notifies).
      - name: Fetch, match and check
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          CG_API_TIER: ${{ secrets.CG_API_TIER }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            uv run cg-id-map run --provider cmc --out data --full-out output --no-check --reset-baseline
          else
            uv run cg-id-map run --provider cmc --out data --full-out output --check
          fi

      - name: Validate published files
        run: |
          uv run python - <<'EOF'
          import csv, json
          rows = list(csv.DictReader(open("data/cmc_to_cg.csv")))
          assert rows and list(rows[0])[:5] == ["cmc_rank", "cmc_id", "cmc_symbol", "cmc_name", "cg_id"], "bad csv"
          assert all(r["cg_id"] for r in rows), "empty cg_id in published csv"
          payload = json.load(open("data/cmc_to_cg.json"))
          assert payload["mappings"] == rows, "csv and json disagree"
          print(f"ok: {len(rows)} mappings")
          EOF

      - name: Commit data/ if it changed
        id: commit
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to published data; nothing committed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: daily update $(date -u +%F) ($(cat output/change_summary.txt))"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Rolling release with stable download URLs:
      #   https://github.com/<owner>/<repo>/releases/download/latest/cmc_to_cg.csv
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest CMC → CoinGecko mapping" --latest \
              --notes "Rolling release, updated by the daily workflow when the mapping changes. See data/CHANGELOG.md for what changed."
            CHANGED=true
          fi
          if [ "$CHANGED" = "true" ]; then
            gh release upload latest data/cmc_to_cg.csv data/cmc_to_cg.json --clobber
          fi

      - name: Upload full output (prices, candidates) for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-output
          path: output/
          retention-days: 14
          if-no-files-found: ignore
